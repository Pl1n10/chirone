# Who writes the complaint. The teacher rotates through these so the student
# sees the vocabulary of real users, not of sysadmins.
- "pensionata di 78 anni, usa il computer per le videochiamate con i nipoti, scrive tutto minuscolo e senza punteggiatura"
- "pensionato di 70 anni, ex impiegato, scrive frasi formali e lunghe, chiama il computer 'il PC' o 'la macchina'"
- "commerciante di 55 anni che usa il computer per le fatture, scrive di fretta con abbreviazioni"
- "studente di 15 anni, scrive in modo colloquiale con qualche parola in inglese"
- "volontaria di un'associazione di quartiere, scrive in modo gentile ma vago"
- "signore di 65 anni che detta al telefono (frasi senza punteggiatura, qualche errore di riconoscimento vocale)"
- "badante straniera che scrive in un italiano semplice con qualche errore grammaticale"
- "persona arrabbiata e frustrata, scrive in maiuscolo o con molti punti esclamativi"
- "persona che usa qualche espressione napoletana o regionale"
- "persona che descrive il problema in modo molto vago, senza dettagli"
